<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Side Panel</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 16px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 8px;
    }
    p {
      margin: 0;
      font-size: 13px;
      opacity: 0.8;
    }
    button {
      margin-top: 12px;
    }
    .section {
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>AI Side Panel (MVP)</h1>
  <p>Local summaries run only when you click the button.</p>
  <div id="statusOutput" class="section"></div>
  <button id="summarizeTabs">Summarize tabs</button>
  <div class="section">
    <h2>Summary</h2>
    <div id="summaryOutput"></div>
  </div>
  <div class="section">
    <h2>Tabs</h2>
    <div id="tabsOutput"></div>
  </div>
  <div class="section">
    <h2>Compare pages</h2>
    <div id="compareStatus"></div>
    <div id="compareTabList"></div>
    <button id="compareTabs">Compare selected</button>
    <div class="section">
      <h3>Comparison notes</h3>
      <div id="compareNotes"></div>
    </div>
    <div class="section">
      <h3>Export (Markdown)</h3>
      <textarea id="compareMarkdown" rows="6" readonly></textarea>
    </div>
    <div class="section">
      <h3>Export (CSV)</h3>
      <textarea id="compareCsv" rows="6" readonly></textarea>
    </div>
  </div>
  <div class="section">
    <h2>Agent actions</h2>
    <p>Actions require explicit confirmation and run on the active tab.</p>
    <div id="agentStatus"></div>
    <div id="agentActionList"></div>
    <h3>Action log</h3>
    <div id="agentLog"></div>
  </div>
  <script type="module" src="ai_side_panel.js"></script>
</body>
</html>
